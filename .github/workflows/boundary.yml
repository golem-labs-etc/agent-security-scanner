# Server-side enforcement of the public/private boundary.
# The pre-push hook is advisory; this is not. It runs on every push and PR and
# cannot be bypassed by a session that skipped installing hooks.
name: boundary

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  no-private-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse guard source, internal specs and site files
        run: |
          BAD=$(git ls-files | grep -iE \
            '^(src|dist|tests)/guard/|^guard/|GLANCE-GUARD-SPEC\.md|GUARDIAN-MVP\.md|BRAND_SPEC\.md|HANDOFF-TO-CLAUDE-CODE\.md|^golem-.*\.md|mvp-technical-architecture\.md|glance-market-read\.md|glance-blue-ocean\.md|^public/|^api/|^data/|^partials/|^vercel\.json$|^dist/' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::This is the PUBLIC MIT repo. Private material must not be committed here."
            echo "$BAD" | sed 's/^/  /'
            echo ""
            echo "  Guard -> glance-guard (private).  Site -> glance-site (private)."
            echo "  Specs -> _private/ (gitignored).  See CLAUDE.md."
            exit 1
          fi
          echo "Boundary clean."

      - name: Refuse diagnostic endpoints
        run: |
          BAD=$(git ls-files | grep -iE 'debug-env|debug-test|/debug-' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Diagnostic endpoints must never ship. See CLAUDE.md."
            echo "$BAD" | sed 's/^/  /'; exit 1
          fi
          echo "No debug endpoints."

      - name: LICENSE must still disclaim the guard
        run: |
          grep -q "does NOT cover Glance guard" LICENSE || {
            echo "::error::LICENSE no longer disclaims the guard. That boundary is deliberate."; exit 1; }
          echo "LICENSE intact."

  suite:
    # Two operating systems on purpose. Four detections were lost to a
    # macOS-specific path comparison (/var vs /private/var) with the suite
    # green throughout, and the adapter suites had never run on Linux at all.
    # A pass on one OS is a partial result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      - run: npx tsc --noEmit

      # semgrep is what `analyze` runs; without it that command finds nothing
      # and the pipe check below cannot produce a report large enough to test
      # what it is there to test. It would then SKIP, loudly, and the rule
      # would be aspirational. Installing it here makes the rule real.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install semgrep

      # The suite was not running here at all: this job type-checked and
      # stopped. The 64 KB stdout truncation would have been caught by
      # tests/pipe.js on the commit that introduced it, had anything run it.
      - run: npm run build
      - run: npm test

      # The Python adapter suites had never run anywhere but one laptop. They
      # are the only coverage of the hooks, the baseline, the one-time notices
      # and the pane contract, so a macOS-only run is not coverage.
      #
      # GLANCE_SCANNER_BIN rather than a global install: the tests must
      # exercise the build from THIS commit, and a global install is one more
      # thing that can silently be a different version.
      # httpx is what fastapi.testclient runs on; uvicorn[standard] does not
      # pull it, and without it the dashboard suite fails on an import.
      - run: pip install 'fastapi' 'uvicorn[standard]' 'httpx'
      - name: Adapter suites
        env:
          GLANCE_SCANNER_BIN: ${{ github.workspace }}/dist/cli.js
        run: |
          chmod +x dist/cli.js
          python adapters/hermes/tests/test_adapter.py
          python adapters/hermes/tests/test_dashboard.py

  # The required status check is a single context named `build`, and a matrix
  # job publishes one context PER LEG -- `build (ubuntu-latest)` and
  # `build (macos-latest)`. Adding the matrix therefore deleted the context the
  # ruleset requires, and every pull request became unmergeable. Caught by the
  # merge of the pull request that introduced it.
  #
  # This job re-creates that one context and makes it mean "every leg passed".
  # `if: always()` so it runs when a leg fails, which is the case it exists for.
  build:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix leg must have passed
        run: |
          result='${{ needs.suite.result }}'
          echo "suite: $result"
          [ "$result" = "success" ] || exit 1
